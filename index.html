<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#faf9f7" />
  <title>Mi Vesícula</title>
  
  <link rel="manifest" href='data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22Mi%20Ves%C3%ADcula%22%2C%22short_name%22%3A%22Ves%C3%ADcula%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23faf9f7%22%2C%22theme_color%22%3A%22%233d3530%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%20100%20100%27%3E%3Ctext%20y%3D%27.9em%27%20font-size%3D%2790%27%3E%F0%9F%8F%B7%EF%B8%8F%3C%2Ftext%3E%3C%2Fsvg%3E%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%7D%5D%7D'>

  <script src="https://unpkg.com/html5-qrcode"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #faf9f7; color: #3d3530; min-height: 100vh; padding-bottom: 60px; }
    #app { max-width: 440px; margin: 0 auto; padding: 20px 16px; }
    
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    header h1 { font-size: 20px; font-weight: 700; color: #3d3530; }
    
    .tabs { display: flex; gap: 4px; background: #f0ece8; border-radius: 12px; padding: 4px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 10px; border-radius: 9px; border: none; cursor: pointer; font-size: 13px; background: transparent; color: #9b8d84; font-family: inherit; }
    .tab-btn.active { background: #fff; color: #3d3530; font-weight: 700; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 12px; color: #7a6e68; margin-bottom: 5px; font-weight: 600; }
    .field input { width: 100%; padding: 12px; border: 1.5px solid #e5dfd8; border-radius: 9px; font-size: 14px; outline: none; background: #fff; }
    
    .search-group { display: flex; gap: 8px; margin-bottom: 10px; }
    .btn-main { width: 100%; padding: 14px; border-radius: 10px; border: none; background: #3d3530; color: #faf9f7; font-size: 14px; font-weight: 600; cursor: pointer; }
    .btn-camera { background: #e5dfd8; color: #3d3530; padding: 0 15px; border-radius: 10px; border: none; cursor: pointer; font-size: 18px; }
    
    #off-results-list { max-height: 250px; overflow-y: auto; margin-bottom: 15px; border-radius: 10px; }
    .search-result-item { background: #fff; padding: 12px; border: 1.5px solid #e5dfd8; border-radius: 9px; margin-bottom: 8px; cursor: pointer; transition: background 0.2s; }
    .search-result-item:active { background: #f0ece8; }
    
    .result { margin-top: 20px; padding: 18px; border-radius: 14px; display: none; }
    .result.visible { display: block; }
    .result.green { background: #f0faf4; border: 1.5px solid #86efac; color: #166534; }
    .result.amber { background: #fffbeb; border: 1.5px solid #fcd34d; color: #92400e; }
    .result.red { background: #fef2f2; border: 1.5px solid #fecaca; color: #991b1b; }
    
    #reader { width: 100%; border-radius: 12px; overflow: hidden; margin-bottom: 15px; display: none; border: 2px solid #3d3530; }
    .loader { font-size: 13px; color: #7a6e68; text-align: center; margin-bottom: 10px; display: none; font-style: italic; }

    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; align-items: flex-end; }
    .modal-overlay.open { display: flex; }
    .modal { background: #faf9f7; width: 100%; padding: 24px; border-radius: 20px 20px 0 0; }
  </style>
</head>
<body>
<div id="app">
  <header>
    <h1>🌿 Mi Vesícula</h1>
    <button onclick="abrirModalLimites()" style="background:none; border:none; font-size:22px; cursor:pointer;">⚙️</button>
  </header>

  <div class="tabs">
    <button id="tab-scan" class="tab-btn active" onclick="switchTab('scan')">🔍 Buscador</button>
    <button id="tab-menu" class="tab-btn" onclick="switchTab('menu')">🍽️ Mi Plato</button>
  </div>

  <div id="panel-scan" class="panel active">
    <div id="reader"></div>
    <div class="field">
      <div class="search-group">
        <input id="off-search" type="text" placeholder="Ej: Lays, Casancrem...">
        <button class="btn-camera" onclick="iniciarEscaneo()" title="Escanear Código">📷</button>
        <button class="btn-main" style="width:auto; padding: 0 20px;" onclick="buscarEnOFF()">Buscar</button>
      </div>
    </div>
    <div id="loader-off" class="loader"></div>
    <div id="off-results-list"></div>

    <div style="display: flex; gap: 10px;">
      <div class="field" style="flex:1;"><label>Grasa Total (100g)</label><input id="calc-grasa" type="number" step="0.1" inputmode="decimal"></div>
      <div class="field" style="flex:1;"><label>Grasa Sat. (100g)</label><input id="calc-grasa-sat" type="number" step="0.1" inputmode="decimal"></div>
    </div>

    <div id="result-scan" class="result">
      <div style="display:flex; align-items:center; gap:8px">
        <span id="res-icon" style="font-size:24px"></span>
        <strong id="res-label"></strong>
      </div>
      <p id="res-text" style="font-size:13px; margin-top:8px"></p>
    </div>
    <button class="btn-main" style="margin-top:15px; background:#7a6e68" onclick="limpiarCalculadora()">Limpiar Todo</button>
  </div>

  <div id="panel-menu" class="panel" style="display:none">
    <p style="text-align:center; color:#7a6e68; margin-top:40px">Próximamente: Armá tu plato combinado.</p>
  </div>
</div>

<div id="modal-limites" class="modal-overlay" onclick="if(event.target===this)cerrarModalLimites()">
  <div class="modal">
    <strong style="font-size:18px; display:block; margin-bottom:15px;">Límites de Seguridad</strong>
    <div class="field"><label>Grasa Total Máxima (g)</label><input id="limite-grasa" type="number" step="0.1"></div>
    <div class="field"><label>Grasa Sat. Máxima (g)</label><input id="limite-grasa-sat" type="number" step="0.1"></div>
    <button class="btn-main" onclick="guardarLimites()">Guardar Configuración</button>
  </div>
</div>

<script src="app.js?v=1.2"></script>
<script>
  let html5QrCode;
  function iniciarEscaneo() {
    const readerDiv = document.getElementById('reader');
    readerDiv.style.display = 'block';
    html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start(
      { facingMode: "environment" }, 
      { fps: 10, qrbox: { width: 250, height: 150 } },
      (decodedText) => {
        buscarEnOFF(decodedText);
        detenerEscaneo();
      },
      (errorMessage) => { }
    ).catch(err => alert("Error de cámara: " + err));
  }
  function detenerEscaneo() {
    if (html5QrCode) {
      html5QrCode.stop().then(() => {
        document.getElementById('reader').style.display = 'none';
      });
    }
  }

  // Registrar un Service Worker vacío para habilitar el botón de instalación PWA
  if ('serviceWorker' in navigator)
