<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#faf9f7" />
  <title>Mi Vesícula</title>
  
  <link rel="manifest" href='data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22Mi%20Ves%C3%ADcula%22%2C%22short_name%22%3A%22Ves%C3%ADcula%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23faf9f7%22%2C%22theme_color%22%3A%22%233d3530%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%20100%20100%27%3E%3Ctext%20y%3D%27.9em%27%20font-size%3D%2790%27%3E%F0%9F%8F%B7%EF%B8%8F%3C%2Ftext%3E%3C%2Fsvg%3E%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%7D%5D%7D'>

  <script src="https://unpkg.com/html5-qrcode"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #faf9f7; color: #3d3530; min-height: 100vh; padding-bottom: 60px; }
    #app { max-width: 440px; margin: 0 auto; padding: 20px 16px; }
    
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    header h1 { font-size: 20px; font-weight: 700; color: #3d3530; }
    
    .tabs { display: flex; gap: 4px; background: #f0ece8; border-radius: 12px; padding: 4px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 10px; border-radius: 9px; border: none; cursor: pointer; font-size: 13px; background: transparent; color: #9b8d84; font-family: inherit; }
    .tab-btn.active { background: #fff; color: #3d3530; font-weight: 700; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 12px; color: #7a6e68; margin-bottom: 5px; font-weight: 600; }
    .field input { width: 100%; padding: 12px; border: 1.5px solid #e5dfd8; border-radius: 9px; font-size: 14px; outline: none; background: #fff; }
    
    .search-group { display: flex; gap: 8px; margin-bottom: 10px; }
    .btn-main { width: 100%; padding: 14px; border-radius: 10px; border: none; background: #3d3530; color: #faf9f7; font-size: 14px; font-weight: 600; cursor: pointer; }
    .btn-camera { background: #e5dfd8; color: #3d3530; padding: 0 15px; border-radius: 10px; border: none; cursor: pointer; font-size: 18px; }
    .btn-secondary { background: #e5dfd8; color: #3d3530; }

    #off-results-list { max-height: 250px; overflow-y: auto; margin-bottom: 15px; border-radius: 10px; }
    .search-result-item { background: #fff; padding: 12px; border: 1.5px solid #e5dfd8; border-radius: 9px; margin-bottom: 8px; cursor: pointer; }
    
    .result { margin-top: 20px; padding: 18px; border-radius: 14px; display: none; }
    .result.visible { display: block; }
    .result.green { background: #f0faf4; border: 1.5px solid #86efac; color: #166534; }
    .result.amber { background: #fffbeb; border: 1.5px solid #fcd34d; color: #92400e; }
    .result.red { background: #fef2f2; border: 1.5px solid #fecaca; color: #991b1b; }
    
    #reader { width: 100%; border-radius: 12px; overflow: hidden; margin-bottom: 15px; display: none; border: 2px solid #3d3530; background: #000; }
    .loader { font-size: 13px; color: #7a6e68; text-align: center; margin-bottom: 10px; display: none; font-style: italic; }

    .plate-item { background: #fff; border: 1px solid #e5dfd8; padding: 12px; border-radius: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .plate-item-info { flex: 1; }
    .btn-delete { background: #fef2f2; color: #991b1b; border: none; padding: 8px; border-radius: 8px; font-size: 14px; cursor: pointer; }

    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; align-items: flex-end; }
    .modal-overlay.open { display: flex; }
    .modal { background: #faf9f7; width: 100%; padding: 24px; border-radius: 20px 20px 0 0; }
  </style>
</head>
<body>
<div id="app">
  <header>
    <h1>🌿 Mi Vesícula</h1>
    <button onclick="abrirModalLimites()" style="background:none; border:none; font-size:22px; cursor:pointer;">⚙️</button>
  </header>

  <div class="tabs">
    <button id="tab-scan" class="tab-btn active" onclick="switchTab('scan')">🔍 Buscador</button>
    <button id="tab-menu" class="tab-btn" onclick="switchTab('menu')">🍽️ Mi Plato</button>
  </div>

  <div id="panel-scan" class="panel">
    <div id="reader"></div>
    <div class="field">
      <div class="search-group">
        <input id="off-search" type="text" placeholder="Ej: Lays, Casancrem...">
        <button class="btn-camera" onclick="iniciarEscaneo()" title="Escanear Código">📷</button>
        <button class="btn-main" style="width:auto; padding: 0 20px;" onclick="buscarEnOFF()">Buscar</button>
      </div>
    </div>
    
    <div id="loader-off" class="loader"></div>
    <div id="off-results-list"></div>

    <div style="display: flex; gap: 10px;">
      <div class="field" style="flex:1;"><label>Grasa Total (100g)</label><input id="calc-grasa" type="number" step="0.1" inputmode="decimal" oninput="calcularPorcionMaxima()"></div>
      <div class="field" style="flex:1;"><label>Grasa Sat. (100g)</label><input id="calc-grasa-sat" type="number" step="0.1" inputmode="decimal" oninput="calcularPorcionMaxima()"></div>
    </div>

    <div id="result-scan" class="result">
      <div style="display:flex; align-items:center; gap:8px">
        <span id="res-icon" style="font-size:24px"></span>
        <strong id="res-label"></strong>
      </div>
      <p id="res-text" style="font-size:13px; margin-top:8px"></p>
      
      <div style="margin-top: 15px; border-top: 1px solid rgba(0,0,0,0.1); padding-top: 15px;">
        <label style="font-size: 11px; font-weight: 700; color: #7a6e68; display: block; margin-bottom: 5px;">PORCIÓN A COMER (g)</label>
        <div style="display: flex; gap: 8px;">
          <input id="porcion-comer" type="number" value="50" style="width: 80px; padding: 8px; border-radius: 8px; border: 1.5px solid #e5dfd8;">
          <button class="btn-main" style="padding: 8px; background: #3d3530;" onclick="agregarAlPlato()">Añadir al Plato</button>
        </div>
      </div>
    </div>
    <button class="btn-main" style="margin-top:15px; background:#7a6e68" onclick="limpiarCalculadora()">Limpiar Todo</button>
  </div>

  <div id="panel-menu" class="panel" style="display:none">
    <div id="resumen-plato" class="result visible green">
      <div style="display:flex; align-items:center; gap:8px">
        <span id="plato-icon" style="font-size:24px">🍽️</span>
        <strong id="plato-label">Plato Vacío</strong>
      </div>
      <p id="plato-text" style="font-size:13px; margin-top:8px">Agregá alimentos desde el buscador.</p>
    </div>

    <div id="lista-plato" style="margin-top: 20px;"></div>
    <button id="btn-vaciar-plato" class="btn-main btn-secondary" style="margin-top: 15px; display: none;" onclick="vaciarPlato()">Vaciar Plato</button>
  </div>
</div>

<div id="modal-limites" class="modal-overlay" onclick="if(event.target===this)cerrarModalLimites()">
  <div class="modal">
    <strong style="font-size:18px; display:block; margin-bottom:15px;">Límites de Seguridad</strong>
    <div class="field"><label>Grasa Total Máxima (g)</label><input id="limite-grasa" type="number" step="0.1"></div>
    <div class="field"><label>Grasa Sat. Máxima (g)</label><input id="limite-grasa-sat" type="number" step="0.1"></div>
    <button class="btn-main" onclick="guardarLimites()">Guardar Configuración</button>
  </div>
</div>

<script>
  // --- Limpiador de Caché / Service Workers ---
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function(registrations) {
      for(let registration of registrations) { registration.unregister(); }
    });
  }

  // --- ESTADO GLOBAL ---
  let limites = { total: 5.0, sat: 2.0 };
  let plato = [];

  // --- INICIO ---
  window.onload = () => {
      const guardados = localStorage.getItem('mis_limites_vesicula');
      if (guardados) limites = JSON.parse(guardados);
      document.getElementById('limite-grasa').value = limites.total;
      document.getElementById('limite-grasa-sat').value = limites.sat;
      
      const platoGuardado = localStorage.getItem('mi_plato_vesicula');
      if (platoGuardado) {
          try { plato = JSON.parse(platoGuardado); } 
          catch(e) { plato = []; }
      }
      renderizarPlato();
  };

  // --- NAVEGACIÓN ---
  function switchTab(tab) {
      document.querySelectorAll('.panel').forEach(p => p.style.display = 'none');
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      
      const panel = document.getElementById(`panel-${tab}`);
      const btn = document.getElementById(`tab-${tab}`);
      
      if(panel) panel.style.display = 'block';
      if(btn) btn.classList.add('active');

      if(tab === 'menu') renderizarPlato();
  }

  // --- CONFIGURACIÓN ---
  function abrirModalLimites() { document.getElementById('modal-limites').classList.add('open'); }
  function cerrarModalLimites() { document.getElementById('modal-limites').classList.remove('open'); }

  function guardarLimites() {
      limites.total = parseFloat(document.getElementById('limite-grasa').value) || 5.0;
      limites.sat = parseFloat(document.getElementById('limite-grasa-sat').value) || 2.0;
      localStorage.setItem('mis_limites_vesicula', JSON.stringify(limites));
      cerrarModalLimites();
      renderizarPlato();
  }

  // --- BUSCADOR ---
  async function buscarEnOFF(barcode = null) {
      const query = barcode || document.getElementById('off-search').value;
      const loader = document.getElementById('loader-off');
      const listaResultados = document.getElementById('off-results-list');
      
      if (!barcode && query.length < 3) return;

      limpiarCalculadora(false);

      loader.style.display = "block";
      loader.innerText = "Buscando...";
      listaResultados.innerHTML = ""; 

      try {
          const url = barcode 
              ? `https://world.openfoodfacts.org/api/v2/product/${barcode}.json`
              : `https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(query)}&search_simple=1&action=process&json=1&page_size=8&cc=ar`;
          
          const response = await fetch(url);
          const data = await response.json();

          if (barcode) {
              if (data.product) {
                  cargarProducto(data.product);
                  loader.style.display = "none";
              } else {
                  loader.innerText = "No encontrado. Cargalo manual.";
              }
          } else {
              if (data.products && data.products.length > 0) {
                  loader.innerText = "Seleccioná:";
                  data.products.forEach(p => {
                      const item = document.createElement('div');
                      item.className = 'search-result-item';
                      item.innerHTML = `<strong>${p.product_name || 'Sin nombre'}</strong><small>${p.brands || ''}</small>`;
                      item.onclick = () => { cargarProducto(p); listaResultados.innerHTML = ""; loader.style.display = "none"; };
                      listaResultados.appendChild(item);
                  });
              } else { loader.innerText = "Sin resultados."; }
          }
      } catch (error) { loader.innerText = "Error de conexión."; }
  }

  function cargarProducto(p) {
      const grasaTotal = p.nutriments['fat_100g'] || 0;
      const grasaSat = p.nutriments['saturated-fat_100g'] || 0;
      document.getElementById('calc-grasa').value = grasaTotal;
      document.getElementById('calc-grasa-sat').value = grasaSat;
      document.getElementById('off-search').value = p.product_name || "";
      calcularPorcionMaxima();
  }

  function calcularPorcionMaxima() {
      const gTotalAlimento = parseFloat(document.getElementById('calc-grasa').value) || 0;
      const gSatAlimento = parseFloat(document.getElementById('calc-grasa-sat').value) || 0;
      const resultDiv = document.getElementById('result-scan');
      
      resultDiv.classList.add('visible');

      if (gTotalAlimento === 0 && gSatAlimento === 0) {
          mostrarResultado("green", "✅", "Alimento Libre", "No tiene grasas detectadas.");
          document.getElementById('porcion-comer').value = 100;
          return;
      }

      let maxPorTotal = gTotalAlimento > 0 ? (limites.total / gTotalAlimento) * 100 : 999;
      let maxPorSat = gSatAlimento > 0 ? (limites.sat / gSatAlimento) * 100 : 999;
      let porcionSegura = Math.floor(Math.min(maxPorTotal, maxPorSat));

      document.getElementById('porcion-comer').value = (porcionSegura > 0 && porcionSegura < 999) ? porcionSegura : 100;

      if (porcionSegura >= 150) mostrarResultado("green", "✅", `Seguro: ${porcionSegura}g`, `Máximo ${porcionSegura}g.`);
      else if (porcionSegura >= 60) mostrarResultado("amber", "⚠️", `Moderado: ${porcionSegura}g`, `Límite ${porcionSegura}g.`);
      else mostrarResultado("red", "🚫", `Riesgo: ${porcionSegura}g`, `Cuidado: solo ${porcionSegura}g.`);
  }

  function mostrarResultado(clase, icono, titulo, descripcion) {
      const res = document.getElementById('result-scan');
      res.className = `result visible ${clase}`;
      document.getElementById('res-icon').innerText = icono;
      document.getElementById('res-label').innerText = titulo;
      document.getElementById('res-text').innerText = descripcion;
  }

  // --- LÓGICA DE MI PLATO ---
  function agregarAlPlato() {
      const nombre = document.getElementById('off-search').value || "Producto";
      const grasaTotal100 = parseFloat(document.getElementById('calc-grasa').value) || 0;
      const grasaSat100 = parseFloat(document.getElementById('calc-grasa-sat').value) || 0;
      const porcionElegida = parseFloat(document.getElementById('porcion-comer').value) || 0;

      if (porcionElegida <= 0) {
          alert("Ingresá los gramos en la calculadora.");
          return;
      }

      const item = {
          id: Date.now(),
          nombre: nombre,
          porcion: porcionElegida,
          grasaTotal: (grasaTotal100 * porcionElegida) / 100,
          grasaSat: (grasaSat100 * porcionElegida) / 100
      };

      plato.push(item);
      localStorage.setItem('mi_plato_vesicula', JSON.stringify(plato));
      
      switchTab('menu'); 
  }

  function renderizarPlato() {
      const lista = document.getElementById('lista-plato');
      const resumen = document.getElementById('resumen-plato');
      const btnVaciar = document.getElementById('btn-vaciar-plato');
      
      if (!lista || !resumen) return;

      lista.innerHTML = "";
      
      if (plato.length === 0) {
          resumen.className = "result visible green";
          document.getElementById('plato-icon').innerText = "🍽️";
          document.getElementById('plato-label').innerText = "Plato Vacío";
          document.getElementById('plato-text').innerText = "Agregá alimentos desde el buscador.";
          btnVaciar.style.display = "none";
          return;
      }

      btnVaciar.style.display = "block";
      let totalG = 0;
      let totalS = 0;

      plato.forEach(item => {
          totalG += item.grasaTotal;
          totalS += item.grasaSat;

          const div = document.createElement('div');
          div.className = "plate-item";
          div.innerHTML = `
              <div class="plate-item-info">
                  <strong>${item.nombre} (${item.porcion}g)</strong>
                  <small>Grasa: ${item.grasaTotal.toFixed(1)}g | Sat: ${item.grasaSat.toFixed(1)}g</small>
              </div>
              <button class="btn-delete" onclick="eliminarDelPlato(${item.id})">🗑️</button>
          `;
          lista.appendChild(div);
      });

      if (totalG > limites.total || totalS > limites.sat) {
          resumen.className = "result visible red";
          document.getElementById('plato-icon').innerText = "🚫";
          document.getElementById('plato-label').innerText = "¡Exceso de Grasa!";
      } else if (totalG > limites.total * 0.8 || totalS > limites.sat * 0.8) {
          resumen.className = "result visible amber";
          document.getElementById('plato-icon').innerText = "⚠️";
          document.getElementById('plato-label').innerText = "Plato al Límite";
      } else {
          resumen.className = "result visible green";
          document.getElementById('plato-icon').innerText = "✅";
          document.getElementById('plato-label').innerText = "Plato Seguro";
      }

      document.getElementById('plato-text').innerText = `Total: ${totalG.toFixed(1)}g grasa / ${totalS.toFixed(1)}g saturada.`;
  }

  function eliminarDelPlato(id) {
      plato = plato.filter(item => item.id !== id);
      localStorage.setItem('mi_plato_vesicula', JSON.stringify(plato));
      renderizarPlato();
  }

  function vaciarPlato() {
      if (confirm("¿Vaciar plato?")) {
          plato = [];
          localStorage.removeItem('mi_plato_vesicula');
          renderizarPlato();
      }
  }

  function limpiarCalculadora(todo = true) {
      document.getElementById('calc-grasa').value = '';
      document.getElementById('calc-grasa-sat').value = '';
      if(todo) document.getElementById('off-search').value = '';
      document.getElementById('off-results-list').innerHTML = '';
      document.getElementById('loader-off').style.display = 'none';
      document.getElementById('result-scan').classList.remove('visible');
  }

  // --- CÁMARA ---
  let html5QrCode;
  function iniciarEscaneo() {
    const readerDiv = document.getElementById('reader');
    readerDiv.style.display = 'block';
    if (typeof Html5Qrcode === 'undefined') { alert("Cargando librería..."); return; }
    if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 150 } },
      (decodedText) => { detenerEscaneo(); buscarEnOFF(decodedText); },
      (errorMessage) => { }
    ).catch(err => { readerDiv.style.display = 'none'; alert("Error de cámara."); });
  }
  function detenerEscaneo() {
    if (html5QrCode) html5QrCode.stop().then(() => { document.getElementById('reader').style.display = 'none'; }).catch(e => {});
  }
</script>
</body>
</html>
